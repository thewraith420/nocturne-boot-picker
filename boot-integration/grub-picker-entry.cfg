# Add to /etc/grub.d/40_custom (or /boot/grub/custom.cfg) on the real
# installed system, then regenerate grub.cfg. Also set in
# /etc/default/grub:
#
#   GRUB_DEFAULT=picker
#   GRUB_TIMEOUT=0
#   GRUB_DISABLE_SUBMENU=true   # keeps every real kernel entry flat/
#                               # top-level so discover-kernels.sh sees
#                               # all of them, not just the newest under
#                               # an "Advanced options" submenu
#
# Update the linux/initrd paths below once picker-kernel + initramfs
# build outputs land somewhere real under /boot.

menuentry 'Boot Picker' --id picker {
        insmod gzio
        insmod part_gpt
        insmod ext2
        linux   /boot/picker/vmlinuz
        initrd  /boot/picker/initramfs.img
}
