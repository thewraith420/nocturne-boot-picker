# Add to /etc/grub.d/40_custom (or /boot/grub/custom.cfg) on the real
# installed system, then regenerate grub.cfg.
#
# Rollout plan (Bob's call): NOT made the default/only path until the
# picker has proven itself. Land this as a plain selectable entry first
# - normal GRUB_DEFAULT and GRUB_TIMEOUT stay untouched, so GRUB's own
# menu/timeout is still there as the real fallback during testing (in
# practice: a long power-button press, not the initramfs rescue shell -
# see initramfs/README.md). Only once the picker's been proven reliable
# through real use does it make sense to flip to:
#
#   GRUB_DEFAULT=picker
#   GRUB_TIMEOUT=0
#
# which is what makes the picker the *only* thing a user ever sees.
#
# No GRUB_DISABLE_SUBMENU needed - initramfs/discover-kernels.sh walks
# into "Advanced options" submenus itself, since real-world testing
# showed that's where most distros actually nest kernel entries.
#
# Update the linux/initrd paths below once picker-kernel + initramfs
# build outputs land somewhere real under /boot.
#
# PREFER install-picker.sh over pasting this by hand: it resolves the
# right path prefix for whether /boot is its own partition, adds the
# search --fs-uuid line, refuses to run under GRUB_DEFAULT=saved, and
# derives the kernel cmdline below from /proc/cmdline automatically.
#
# THE CMDLINE IS NOT OPTIONAL. A bare `linux /boot/picker/vmlinuz` cost
# a full boot cycle: the Slate's panel produces NO VISIBLE OUTPUT
# without i915.enable_dpcd_backlight=2 and i915.enable_psr=0, and it
# fails silently in the worst way - drmModeSetCrtc returns SUCCESS, so
# picker cannot detect it. The modeset works; the backlight never
# lights. Everything ran perfectly against a black screen: touch found,
# menu rendered, timeout fired, kexec completed.
#
# These are this panel's quirks. On other hardware, copy whatever
# display-related options the working entries in your own grub.cfg
# already carry - that set is, by definition, known to light the panel.

menuentry 'Boot Picker' --id picker {
        insmod gzio
        insmod part_gpt
        insmod ext2
        linux   /boot/picker/vmlinuz i915.enable_dpcd_backlight=2 i915.enable_psr=0
        initrd  /boot/picker/initramfs.img
}
